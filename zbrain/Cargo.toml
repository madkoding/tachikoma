[package]
name = "zbrain"
version = "0.1.0"
edition = "2021"
description = "Z-Brain: AI-Shell CLI wrapper for NEURO-OS"
authors = ["NEURO-OS Team"]
license = "MIT"

[[bin]]
name = "zbrain"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
colored = "2.1"
anyhow = "1.0"
directories = "5.0"
toml = "0.8"
uuid = { version = "1.7", features = ["v4"] }
urlencoding = "2.1.3"