name: CD - Release & Deploy

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release-rust-services:
    name: Release Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [neuro-backend, neuro-chat, neuro-memory, neuro-agent, neuro-voice, neuro-music]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
      - run: cargo build --release -p ${{ matrix.service }}
      - run: mkdir -p artifacts && cp target/release/${{ matrix.service }} artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-${{ github.ref_name }}
          path: artifacts/${{ matrix.service }}
          retention-days: 30

  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: release-rust-services
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-chat/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-chat:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-chat:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-memory/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-memory:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-memory:latest

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-rust-services, docker-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            zip -r ../${dir%/}.zip .
            cd ..
          done
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          make_latest: true