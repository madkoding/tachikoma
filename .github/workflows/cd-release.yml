name: CD - Release & Deploy

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release-rust-services:
    name: Release Rust Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [neuro-backend, neuro-chat, neuro-memory, neuro-agent, neuro-voice, neuro-music]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
      - run: cargo build --release -p ${{ matrix.service }}
      - run: mkdir -p artifacts && cp target/release/${{ matrix.service }} artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-${{ github.ref_name }}
          path: artifacts/${{ matrix.service }}
          retention-days: 30

  docker-publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: release-rust-services
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-chat/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-chat:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-chat:latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: neuro-memory/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neuro-memory:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/neuro-memory:latest

  desktop-bundle:
    name: Desktop Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    defaults:
      run:
        working-directory: apps/tachikoma-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tachikoma-desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/tachikoma-desktop/package-lock.json
      - run: npm ci
      - name: Build sidecars
        run: ./scripts/build-sidecars.sh ${{ matrix.target }}
      - name: Build Tauri app
        run: npm run tauri:build
      - name: Collect installers
        run: |
          mkdir -p installers
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} installers/ \;
          ls -la installers/
      - uses: actions/upload-artifact@v4
        with:
          name: tachikoma-desktop-${{ matrix.target }}-${{ github.ref_name }}
          path: apps/tachikoma-desktop/installers/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-rust-services, docker-publish, desktop-bundle]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            zip -r ../${dir%/}.zip .
            cd ..
          done
      - name: Generate updater manifest
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cat > artifacts/update.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Release $TAG",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/tachikoma-desktop-x86_64-unknown-linux-gnu-${GITHUB_REF_NAME}.zip"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/tachikoma-desktop-x86_64-pc-windows-msvc-${GITHUB_REF_NAME}.zip"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/tachikoma-desktop-aarch64-apple-darwin-${GITHUB_REF_NAME}.zip"
              }
            }
          }
          EOF
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.zip
            artifacts/update.json
          generate_release_notes: true
          make_latest: true