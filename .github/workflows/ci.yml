name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude tachikoma-voice -- -D warnings
      - run: cargo build --workspace --exclude tachikoma-voice
      - run: cargo test --workspace --exclude tachikoma-voice
      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit
        continue-on-error: true

  desktop-tauri:
    name: Desktop (Tauri v2) Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tachikoma-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tachikoma-desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/tachikoma-desktop/package-lock.json
      - run: npm ci
      - name: Build neuro-ui frontend (frontendDist requerido por tauri_build)
        working-directory: neuro-ui
        run: |
          npm ci
          npm run build
      - name: Prepare sidecar binaries
        run: |
          mkdir -p src-tauri/binaries
          # surrealdb: vendored release binary (tauri_build validates existence)
          curl -sL https://github.com/surrealdb/surrealdb/releases/download/v1.5.6/surreal-v1.5.6.linux-amd64.tgz | tar xz
          cp surreal src-tauri/binaries/surrealdb-x86_64-unknown-linux-gnu
          # workspace sidecars: debug build is enough for clippy/test validation
          cargo build --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --workspace --exclude tachikoma-voice
          for b in tachikoma-backend tachikoma-checklists tachikoma-music tachikoma-chat tachikoma-memory tachikoma-agent; do
            cp "$GITHUB_WORKSPACE/target/debug/$b" "src-tauri/binaries/$b-x86_64-unknown-linux-gnu"
          done
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  typescript-checks:
    name: TypeScript Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [neuro-ui, neuro-admin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci
      - working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
      - working-directory: ${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high
      - working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config
      - run: docker compose build neuro-agent neuro-chat neuro-memory