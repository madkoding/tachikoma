name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-tests:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude neuro-voice -- -D warnings
      - run: cargo build --workspace --exclude neuro-voice
      - run: cargo test --workspace --exclude neuro-voice

  typescript-checks:
    name: TypeScript Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [neuro-ui, neuro-admin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - working-directory: ${{ matrix.app }}
        run: npm ci
      - working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
      - working-directory: ${{ matrix.app }}
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config
      - run: docker compose build neuro-backend neuro-chat neuro-memory