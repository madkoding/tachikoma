[package]
name = "tachikoma-voice"
version = "1.0.0"
edition = "2021"
authors = ["TACHIKOMA-OS Team"]
description = "Voice synthesis service using Piper TTS with robotic effects"
license = "MIT"

[dependencies]
neuro-common = { path = "../neuro-common" }
axum = { workspace = true }
tokio = { version = "1.40", features = ["full", "process"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hound = "3.5"
opus = "0.3"
ogg = "0.9"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = "1.10"
lazy_static = "1.5"
base64 = "0.22"
futures = "0.3"
dotenvy = { workspace = true }